trigger: cron  # every 15 min, free
steps:
  - name: pulse
    run: |
      curl -X POST http://0.000.0000:8080/sync \
        -H "Authorization: Bearer $(aliyun sts assume-role-with-web-identity ...)" \
        -d '{"ts":"'$(date -uIseconds)'","build":"'$BUILD_ID'"}'
  - name: locker
    if: files_changed
    run: |
      url=$(aliyun oss sign-url --expire 3600 --method PUT oss://bucket/artifact.zip)
      curl -T artifact.zip "$url"

# Notification Hooks (Optional)
notifications:
  - type: webhook
    on: success
    url: "${BUILD_ENDPOINT}/notifications/success"
  - type: webhook
    on: failure
    url: "${BUILD_ENDPOINT}/notifications/failure"