[project]
name = "src"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "uvx>=0.1.0",
]

dev-dependencies = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

ffi-modules = []
src-path = "src"
tests-path = "tests"

[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "I", "N", "W"]
ignore = []
fixable = ["A", "B", "C", "D", "E", "F", "I"]
