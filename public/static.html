<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <style>
        /* Essential styles for the workspace */
        body, html { height: 100%; margin: 0; overflow: hidden; }
        .workspace { display: flex; height: 100vh; width: 100vw; }
        
        #editor { 
            flex: 1; 
            height: 100%; 
            padding: 2rem; 
            border: none; 
            outline: none; 
            resize: none; 
            font-family: 'Monaco', 'Consolas', monospace; 
            font-size: 14px;
            line-height: 1.6;
        }

        #preview { 
            flex: 1; 
            height: 100%; 
            padding: 2rem; 
            overflow-y: auto; 
            background-color: #fafafa;
            border-left: 1px solid #e5e7eb;
        }

        /* Mobile responsive behavior: hide preview by default */
        @media (max-width: 768px) {
            #preview { display: none; }
        }
    </style>
</head>

<body>
    <div class="workspace">
        <textarea id="editor" placeholder="Start typing Markdown..."># Welcome

Type your content on the left, see it rendered on the right.</textarea>
        
        <div id="preview" class="prose max-w-none"></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        // Simple Markdown parser
        function render() {
            const raw = editor.value;
            
            // Basic parsing logic: Headers, Code, Lists, Paragraphs
            let html = raw
                .replace(/^# (.*$)/gm, '<h1>$1</h1>')
                .replace(/^## (.*$)/gm, '<h2>$1</h2>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/^\- (.*$)/gm, '<li>$1</li>');

            // Wrap orphans in paragraphs
            preview.innerHTML = html.split('\n\n').map(p => {
                if (p.trim().startsWith('<')) return p;
                return `<p>${p.replace(/\n/g, '<br>')}</p>`;
            }).join('');
        }

        // Listen for input
        editor.addEventListener('input', render);

        // Initial render
        render();
    </script>
</body>
</html>
